<style>
/* TORQ Team Portal — one sign-in for every TORQ team page.
   Layout: sticky top bar · greeting + "needs review" strip · tool tiles · events + activity · links + team */
:root{
  --bg:#0b0b0d; --bg2:#101014; --card:#15151a; --card2:#1c1c23; --card3:#24242d;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f4f4f6; --muted:#9a9aa6; --dim:#66666f;
  --red:#ff2d2d; --red2:#ff5a36; --redglow:rgba(255,45,45,.32); --redbg:rgba(255,45,45,.11);
  --green:#2ee59d; --greenbg:rgba(46,229,157,.11); --amber:#ffb020; --amberbg:rgba(255,176,32,.12); --blue:#6aa8ff; --bluebg:rgba(106,168,255,.12);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Sora','Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(900px 520px at 88% -12%,rgba(255,45,45,.15),transparent 62%),
  radial-gradient(700px 420px at -12% 110%,rgba(255,90,54,.07),transparent 60%)}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
svg{flex:none}

/* logo */
.logo{display:inline-grid;justify-items:center;gap:.55em;line-height:1}
.logo img{display:block;width:100%;height:auto}
.logo .tag{display:flex;align-items:center;gap:.9em;width:100%;font:500 .95em var(--display);letter-spacing:.55em;text-indent:.55em;text-transform:uppercase;color:var(--text)}
.logo .tag::before,.logo .tag::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
.logo .tag::after{background:linear-gradient(270deg,transparent,var(--red))}
.logo.anim img{clip-path:inset(0 100% 0 0);transform:translateX(-20px) skewX(-10deg);filter:blur(4px);animation:wipe .75s var(--ease) .1s forwards}
.logo.anim .tag{opacity:0;letter-spacing:1.4em;animation:tagIn .8s var(--ease) .7s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0);transform:none;filter:none}}
@keyframes tagIn{to{opacity:1;letter-spacing:.55em}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line2);transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--card3)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--red2),var(--red));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px var(--redglow)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.block{width:100%;height:50px;font-size:15px}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:50%;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--card2);color:var(--text)} .icon-btn svg{width:18px;height:18px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--red);animation:spin .7s linear infinite;display:inline-block}
.spinner.sm{width:15px;height:15px;border-width:2px;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* boot + login */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.login{width:min(420px,100%);display:grid;gap:26px;animation:rise .5s var(--ease)}
.login .logo{width:min(300px,78%);justify-self:center;font-size:clamp(13px,3.6vw,16px)}
.login-card{padding:26px 22px 24px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;height:50px;padding:0 15px;border-radius:13px;background:var(--bg2);border:1px solid var(--line2);outline:0;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
.err{display:none;padding:11px 13px;border-radius:12px;background:var(--redbg);border:1px solid rgba(255,45,45,.3);color:#ffb3b3;font-size:13.5px;margin-bottom:14px}
.err.show{display:block;animation:shake .35s}
.note{font-size:12.5px;color:var(--dim);text-align:center;margin-top:14px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(11,11,13,.8);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:22px;width:auto}
.brand .pill-team{font:600 10.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;padding:5px 9px 5px 10px;border-radius:5px;background:var(--red);color:#fff;transform:skewX(-12deg)}
.brand .pill-team b{display:inline-block;transform:skewX(12deg);font-weight:600}
.me{display:flex;align-items:center;gap:6px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--display);background:linear-gradient(135deg,#2a2a33,#1a1a20);border:1px solid var(--line2)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;padding:8px;border-radius:16px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 20px 50px -15px rgba(0,0,0,.8);transform-origin:top right;animation:pop .18s var(--ease)}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block;font-size:14px} .menu .who span{font-size:12.5px;color:var(--muted);word-break:break-all}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;font-size:14px;color:var(--text);text-align:left}
.menu button:hover{background:var(--card3)} .menu button svg{width:16px;height:16px;color:var(--muted)}

/* page */

.stat.live{border-color:rgba(255,45,45,.35)}

/* sections */

.tool{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px;border-radius:var(--r);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);overflow:hidden;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:rise .5s var(--ease) both;animation-delay:calc(120ms + var(--i)*70ms)}

.tool:hover::after{transform:translateX(100%)}

.tool .go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card3);color:var(--muted);transition:background .25s,color .25s,transform .25s var(--ease)}

.tool .go svg{width:17px;height:17px}
.count{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font:600 11px var(--mono);background:var(--amberbg);color:var(--amber);border:1px solid rgba(255,176,32,.3)}
.count.zero{background:var(--greenbg);color:var(--green);border-color:rgba(46,229,157,.25)}
.count.live{background:var(--redbg);color:#ff8a8a;border-color:rgba(255,45,45,.3)}
.count.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,45,.6)}70%{box-shadow:0 0 0 6px rgba(255,45,45,0)}100%{box-shadow:0 0 0 0 rgba(255,45,45,0)}}

.panel{padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);min-width:0;animation:rise .5s var(--ease) both;animation-delay:calc(300ms + var(--i)*70ms)}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
a.row:hover .ttl{color:#fff;text-decoration:underline;text-decoration-color:var(--line2)}

.ev{display:grid;gap:8px;padding:12px 4px;border-top:1px solid var(--line)}

.ev-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.lnk .dot{flex:none}
.lnk a{min-width:0;flex:1}
.lnk b{display:block;font-size:14px;font-weight:600}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}

.sheet{width:min(420px,100%);padding:22px;border-radius:20px;background:var(--bg2);border:1px solid var(--line2);animation:rise .3s var(--ease)}

.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{max-width:420px;padding:11px 16px;border-radius:13px;background:var(--card3);border:1px solid var(--line2);font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);animation:rise .3s var(--spring)}
.toast.ok{background:#0f2b20;border-color:rgba(46,229,157,.35);color:#b7f5da}
.toast.err{background:#3a1416;border-color:rgba(255,45,45,.4);color:#ffc7c7}
.skel{border-radius:14px;background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}

/* team & permissions */
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger-fill{background:#c42424;border-color:transparent;color:#fff}
.icon-btn.danger:hover{background:var(--redbg);color:#ff8a8a}

.seg button{height:36px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button span{font:600 11px var(--mono);color:var(--dim);margin-left:4px}
.seg button.on{background:var(--card3);color:var(--text)}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.search svg{width:17px;height:17px;color:var(--dim)} .search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);animation:rise .4s var(--ease) both;animation-delay:calc(min(var(--i),12)*35ms)}
@media(max-width:560px){.person{grid-template-columns:auto minmax(0,1fr)}.pacts{grid-column:1/-1;justify-content:flex-start}}

.pinfo{min-width:0}

.pinfo>span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rtag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--card2);border:1px solid var(--line2);color:var(--muted)}
.rtag svg{width:12px;height:12px}
.rtag.admin{background:var(--redbg);border-color:rgba(255,45,45,.3);color:#ff8a8a}
.rtag.super{background:linear-gradient(135deg,rgba(255,211,107,.18),rgba(255,176,32,.1));border-color:rgba(255,176,32,.45);color:var(--amber)}

.areas{font-size:12.5px;color:var(--dim);margin-top:6px}

select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;font-size:14px}

.ph{font-size:15px;margin:10px 0 8px}

.pg-h{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px;color:var(--muted)}

}

function toast(msg, type = '') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), 3200); }
function ago(iso) {
  if (!iso) return ''; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function countUp(el, to) {
  const t0 = performance.now(), d = 700;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !to) { el.textContent = to; return; }
  (function f(t) { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
}

  { group: 'Vehicle Submissions', icon: 'car', items: [['submissions.view', 'See car submissions'], ['submissions.review', 'Approve & deny cars'], ['submissions.events', 'Create & edit show events']] },
  { group: 'Sponsors & Partners', icon: 'handshake', items: [['sponsors.view', 'See sponsor inquiries'], ['sponsors.review', 'Approve & deny inquiries']] },
  { group: 'Brand Ambassadors', icon: 'star', items: [['ambassadors.view', 'See ambassador applications'], ['ambassadors.review', 'Approve & deny applications']] },
  { group: 'TORQ VOTE', icon: 'trophy', items: [['vote.view', 'See vote results'], ['vote.manage', 'Run votes (events, awards, cars)']] },
  { group: 'Team', icon: 'user', items: [['team.view', 'See the team directory']] },
];
const PERM_KEYS = PERMS.flatMap(g => g.items.map(i => i[0]));
const MEMBER_DEFAULT = ['submissions.view', 'submissions.review', 'sponsors.view', 'sponsors.review', 'ambassadors.view', 'ambassadors.review', 'vote.view', 'team.view'];
const defaultPerm = (u, k) => u.is_super || u.isSuper || u.role === 'admin' || MEMBER_DEFAULT.includes(k);
const roleLabel = u => (u.is_super || u.isSuper) ? 'Super admin' : u.role === 'admin' ? 'Admin' : 'Team member';
const can = k => !!(ME && ME.perms && ME.perms[k]);

async function loadMe(session) {
  if (!session) return null;
  let r = await sb.from('team_profiles').select('id,name,email,role,is_super,group_id').eq('id', session.user.id).maybeSingle();
  if (r.error) r = await sb.from('team_profiles').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
  const d = r.data; if (!d) return false;
  const me = { id: d.id, name: d.name || session.user.email, email: d.email || session.user.email, role: d.role || 'reviewer', isSuper: !!d.is_super, groupId: d.group_id || null };
  me.isAdmin = me.isSuper || me.role === 'admin';
  const p = await sb.rpc('torq_my_perms');
  me.permsReady = !p.error;
  me.perms = me.permsReady && p.data ? p.data : Object.fromEntries(PERM_KEYS.map(k => [k, defaultPerm(me, k)]));
  return me;
}

async function boot() {
  const { data } = await sb.auth.getSession();
  const me = await loadMe(data.session);
  if (me === false) { await sb.auth.signOut(); return viewLogin("This account isn't on the TORQ team. Ask an admin to add you."); }
  if (!me) return viewLogin();
  ME = me;
  const next = nextParam(); if (next) { location.replace(next); return; }
  show();
}
function show() { if (!ME) return viewLogin(); if (location.hash === '#team' && (can('team.view') || ME.isAdmin)) viewTeam(); else viewHome(); }
addEventListener('hashchange', () => { if (ME) { scrollTo(0, 0); show(); } });

function viewLogin(msg = '') {
  app.innerHTML = `<div class="center"><div class="login">${logoHTML('anim')}
<div class="login-card"><h1>Team sign in</h1><p class="sub">Use your TORQ team account. It's the same login as the submission, sponsor and ambassador team pages.</p>
<div class="err ${msg ? 'show' : ''}" id="err">${esc(msg)}</div>
<form id="f"><label class="fld"><span>Email</span><input class="inp" type="email" id="email" autocomplete="username" required></label>
<label class="fld"><span>Password</span><input class="inp" type="password" id="pw" autocomplete="current-password" required></label>
<button class="btn primary block" id="go" type="submit">Sign in</button></form>
<p class="note">Forgot your password? Ask a TORQ admin to reset it.</p></div></div></div>`;
  $('#email').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#go'), err = $('#err'); btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Signing in…'; err.classList.remove('show');
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim().toLowerCase(), password: $('#pw').value });
    const fail = m => { err.textContent = m; void err.offsetWidth; err.classList.add('show'); btn.disabled = false; btn.textContent = 'Sign in'; };
    if (error) return fail(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message);
    const me = await loadMe(data.session);
    if (!me) { await sb.auth.signOut(); return fail("Signed in, but this account isn't on the TORQ team. Ask an admin to add you."); }
    ME = me;
    const next = nextParam(); if (next) { location.replace(next); return; }
    history.replaceState(null, '', location.pathname);
    show();
  };
}

  const today = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  app.innerHTML = `<header class="topbar"><a class="brand" href="index.html" aria-label="TORQ Team Portal"><img src="${LOGO}" alt="TORQ"><span class="pill-team"><b>Team</b></span></a>
<div class="me"><button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">${I.refresh}</button>
<div class="menu-wrap"><button class="avatar" id="meBtn" aria-haspopup="true" aria-label="Account">${esc(initials(ME.name))}</button></div></div></header>
<main class="page">
<section class="hello"><div><p class="eyebrow">${esc(today)}</p><h1>${greet}, ${esc(first)}</h1><p>Everything TORQ, one sign-in. <span class="role ${ME.isAdmin ? 'admin' : ''}">${esc(roleLabel(ME))}</span></p></div></section>
<section class="attn" id="attn">${[0, 1, 2, 3].map(i => `<div class="skel" style="height:82px"></div>`).join('')}</section>
<section><div class="sec-head"><h2>Team tools</h2><span>Open any tool, no second sign-in</span></div>
<div class="tools">${TOOLS.filter(t => can(t.perm)).length ? '' : `<div class="empty" style="grid-column:1/-1">You don't have access to any tools yet. Ask a TORQ admin to set your permissions.</div>`}${TOOLS.filter(t => can(t.perm)).map((t, i) => `<a class="tool" href="${t.href}" style="--i:${i};--tone:${t.tone};--tint:${t.tint}"><span class="ic">${I[t.icon]}</span><div><h3>${esc(t.name)} <span id="c-${t.id}"></span></h3><p>${esc(t.desc)}</p></div><span class="go">${I.arrow}</span></a>`).join('')}</div></section>
<section class="cols">${can('submissions.view') ? '' : '<!--'}<div class="panel" style="--i:0"><div class="sec-head"><h2>Show events</h2><span>Car submissions by status</span></div><div id="events"><div class="skel" style="height:140px"></div></div></div>${can('submissions.view') ? '' : '-->'}
<div class="panel" style="--i:1"><div class="sec-head"><h2>Latest activity</h2><span>Newest across all forms</span></div><div id="activity" class="rows"><div class="skel" style="height:140px"></div></div></div></section>
<section><div class="sec-head"><h2>Public links</h2><span>Tap to open · copy to share</span></div>
<div class="links">${LINKS.map((l, i) => `<div class="lnk" style="--i:${i}"><span class="dot">${I[l.icon]}</span><a href="${l.url}" target="_blank" rel="noopener"><b>${esc(l.name)}</b><span>${esc(l.url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</span></a><span class="open" aria-hidden="true">${I.ext}</span><button class="icon-btn cp" data-copy="${l.url}" aria-label="Copy ${esc(l.name)} link" title="Copy link">${I.copy}</button></div>`).join('')}</div></section>
${can('team.view') || ME.isAdmin ? `<section><div class="sec-head"><h2>Team</h2><span id="team-n"></span></div><a class="tool team-card" href="#team" style="--i:0;--tone:var(--text);--tint:var(--card3)"><span class="ic">${I.user}</span><div><h3>Team &amp; permissions</h3><p>${ME.isAdmin ? 'Add people, sort them into groups and choose exactly what each person can see and do.' : 'See who is on the TORQ team.'}</p><div class="faces" id="faces"></div></div><span class="go">${I.arrow}</span></a></section>` : ''}
<p class="foot">TORQ Team Portal · TorqEvents, LLC · Team members only</p>
</main>`;

  $('#meBtn').onclick = e => { e.stopPropagation(); toggleMenu(); };
  $('#refresh').onclick = () => { loadData(); toast('Refreshed', 'ok'); };
  app.onclick = async e => {
    const c = e.target.closest('[data-copy]'); if (!c) return;
    try { await navigator.clipboard.writeText(c.dataset.copy); toast('Link copied', 'ok'); } catch { toast(c.dataset.copy); }
  };
  loadData();
  clearInterval(window.__poll); window.__poll = setInterval(() => { if (!document.hidden) loadData(true); }, 60000);
}

function toggleMenu() {
  const wrap = $('.menu-wrap'); const open = $('.menu', wrap);
  if (open) { open.remove(); return; }
  wrap.insertAdjacentHTML('beforeend', `<div class="menu" role="menu"><div class="who"><b>${esc(ME.name)}</b><span>${esc(ME.email)}</span></div>
${can('team.view') || ME.isAdmin ? `<button data-m="team">${I.user} Team &amp; permissions</button>` : ''}<button data-m="pw">${I.key} Change my password</button><button data-m="out">${I.logout} Sign out everywhere</button></div>`);
  const m = $('.menu', wrap);
  m.onclick = async e => {
    const b = e.target.closest('[data-m]'); if (!b) return; m.remove();
    if (b.dataset.m === 'out') { await sb.auth.signOut(); ME = null; viewLogin(); toast('Signed out', 'ok'); }
    if (b.dataset.m === 'pw') changePassword();
    if (b.dataset.m === 'team') location.hash = 'team';
  };
  setTimeout(() => document.addEventListener('click', function off(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', off); } }), 0);
}

function changePassword() {
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<form class="sheet" id="pwf"><h3>Change my password</h3><p class="sub">This changes it for every TORQ team page.</p>
<label class="fld"><span>New password</span><input class="inp" type="password" id="np" minlength="8" autocomplete="new-password" required></label>
<label class="fld"><span>Type it again</span><input class="inp" type="password" id="np2" minlength="8" autocomplete="new-password" required></label>
<div class="err" id="pwerr"></div><div class="acts"><button type="button" class="btn ghost" id="cx">Cancel</button><button class="btn primary" id="sv">Save password</button></div></form>`;
  document.body.appendChild(w); $('#np', w).focus();
  const close = () => w.remove();
  $('#cx', w).onclick = close; w.onclick = e => { if (e.target === w) close(); };
  $('#pwf', w).onsubmit = async e => {
    e.preventDefault(); const a = $('#np', w).value, b = $('#np2', w).value, er = $('#pwerr', w);
    if (a.length < 8) { er.textContent = 'Use at least 8 characters.'; er.classList.add('show'); return; }
    if (a !== b) { er.textContent = "The two passwords don't match."; er.classList.add('show'); return; }
    $('#sv', w).disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { er.textContent = error.message; er.classList.add('show'); $('#sv', w).disabled = false; return; }
    close(); toast('Password updated', 'ok');
  };
}

/* ---------- data ---------- */
async function safe(p) { try { const r = await p; return r.error ? null : r; } catch { return null; } }
const countPending = t => safe(sb.from(t).select('id', { count: 'exact', head: true }).eq('status', 'pending'));

async function loadData(quiet) {
  const [pSub, pSpo, pAmb, liveVotes, events, subs, recSub, recSpo, recAmb, team] = await Promise.all([
    countPending('submissions'), countPending('sponsor_inquiries'), countPending('ambassador_applications'),
    safe(sb.from('vote_events').select('id', { count: 'exact', head: true }).eq('status', 'live')),
    safe(sb.from('events').select('id,name,event_date,location,active,created_at').order('created_at', { ascending: false }).limit(4)),
    safe(sb.from('submissions').select('event_id,status')),
    safe(sb.from('submissions').select('id,full_name,vehicle,status,submitted_at').order('submitted_at', { ascending: false }).limit(6)),
    safe(sb.from('sponsor_inquiries').select('id,company_name,contact_name_title,status,submitted_at').order('submitted_at', { ascending: false }).limit(6)),
    safe(sb.from('ambassador_applications').select('id,full_name,instagram_handle,status,submitted_at').order('submitted_at', { ascending: false }).limit(6)),
    safe(sb.from('team_profiles').select('id,name,email,role').order('created_at')),
  ]);
  if (!$('#attn')) return;
  const n = r => r ? (r.count ?? 0) : null;
  const counts = { submissions: n(pSub), sponsors: n(pSpo), ambassadors: n(pAmb), vote: n(liveVotes) };

  // needs-attention strip
  const stats = [
    { k: 'submissions', label: 'Cars waiting review', href: TOOLS[0].href },
    { k: 'sponsors', label: 'Sponsor inquiries waiting', href: TOOLS[1].href },
    { k: 'ambassadors', label: 'Ambassador apps waiting', href: TOOLS[2].href },
    { k: 'vote', label: 'Votes live right now', href: TOOLS[3].href, live: true },
  ];
  const vis = stats.filter(s => can(TOOLS.find(x => x.id === s.k).perm));
  $('#attn').style.gridTemplateColumns = vis.length > 1 ? '' : '1fr';
  if (!vis.length) $('#attn').remove();
  else $('#attn').innerHTML = vis.map((s, i) => { const v = counts[s.k]; return `<a class="stat ${v ? (s.live ? 'live' : 'hot') : ''}" href="${s.href}" style="--i:${i}"><b data-n="${v ?? ''}">${v == null ? '–' : quiet ? v : 0}</b><span>${s.label}</span></a>`; }).join('');
  if (!quiet && vis.length) $$('#attn b[data-n]').forEach(b => b.dataset.n !== '' && countUp(b, +b.dataset.n));

  // tile badges
  for (const t of TOOLS) {
    const el = $('#c-' + t.id), v = counts[t.id]; if (!el) continue;
    el.innerHTML = v == null ? '' : t.id === 'vote' ? (v ? `<span class="count live">${v} live</span>` : '') : v ? `<span class="count">${v} pending</span>` : `<span class="count zero">all caught up</span>`;
  }

  // events with submission breakdown
  const evs = events?.data || [], all = subs?.data || [];
  if ($('#events')) $('#events').innerHTML = evs.length ? evs.map(ev => {
    const mine = all.filter(s => String(s.event_id) === String(ev.id));
    const a = mine.filter(s => s.status === 'approved').length, p = mine.filter(s => s.status === 'pending').length, d = mine.filter(s => s.status === 'denied').length, tot = mine.length || 1;
    return `<div class="ev"><div class="ev-top"><div><h4>${esc(ev.name)}</h4><p class="meta">${esc([ev.event_date, ev.location].filter(Boolean).join(' · ') || 'Date TBD')}</p></div><span class="st ${ev.active ? 'open' : ''}">${ev.active ? 'Registration open' : 'Closed'}</span></div>
<div class="bar"><i class="a" style="width:0" data-w="${a / tot * 100}%"></i><i class="p" style="width:0" data-w="${p / tot * 100}%"></i><i class="d" style="width:0" data-w="${d / tot * 100}%"></i></div>
<div class="legend"><span><i style="background:var(--green)"></i>${a} approved</span><span><i style="background:var(--amber)"></i>${p} pending</span><span><i style="background:#ff6b6b"></i>${d} denied</span></div></div>`;
  }).join('') : `<div class="empty">No show events yet. Create one in Vehicle Submissions → Events.</div>`;
  requestAnimationFrame(() => $$('#events .bar i').forEach(i => i.style.width = i.dataset.w));

  // activity feed
  const act = [
    ...(can('submissions.view') ? recSub?.data || [] : []).map(r => ({ t: r.submitted_at, title: r.full_name, meta: 'Vehicle · ' + (r.vehicle || ''), status: r.status, href: TOOLS[0].href, icon: 'car' })),
    ...(can('sponsors.view') ? recSpo?.data || [] : []).map(r => ({ t: r.submitted_at, title: r.company_name, meta: 'Sponsor · ' + (r.contact_name_title || ''), status: r.status, href: TOOLS[1].href, icon: 'handshake' })),
    ...(can('ambassadors.view') ? recAmb?.data || [] : []).map(r => ({ t: r.submitted_at, title: r.full_name, meta: 'Ambassador' + (r.instagram_handle ? ' · ' + r.instagram_handle : ''), status: r.status, href: TOOLS[2].href, icon: 'star' })),
  ].sort((a, b) => new Date(b.t) - new Date(a.t)).slice(0, 7);
  $('#activity').innerHTML = act.length ? act.map(r => `<a class="row" href="${r.href}"><span class="dot">${I[r.icon]}</span><div style="min-width:0"><div class="ttl">${esc(r.title || 'Untitled')}</div><div class="meta">${esc(r.meta)} · ${ago(r.t)}</div></div><span class="st ${esc(r.status)}">${esc(r.status || '')}</span></a>`).join('')
    : `<div class="empty">No submissions yet.</div>`;

  // team summary
  const tm = team?.data || [];
  if ($('#team-n')) { $('#team-n').textContent = `${tm.length} member${tm.length === 1 ? '' : 's'}`; $('#faces').innerHTML = tm.slice(0, 8).map(u => `<span class="avatar xs" title="${esc(u.name)}">${esc(initials(u.name))}</span>`).join('') + (tm.length > 8 ? `<span class="avatar xs">+${tm.length - 8}</span>` : ''); }
}


/* ---------- team & permissions ---------- */
const COLORS = ['#ff2d2d', '#ff8a3d', '#ffb020', '#2ee59d', '#3dd6ff', '#6aa8ff', '#a78bfa', '#f472b6', '#9a9aa6'];
let TEAM = { people: [], groups: [], tab: 'people', q: '' };

function topbar() {
  return `<header class="topbar"><a class="brand" href="index.html" aria-label="TORQ Team Portal"><img src="${LOGO}" alt="TORQ"><span class="pill-team"><b>Team</b></span></a>
<div class="me"><div class="menu-wrap"><button class="avatar" id="meBtn" aria-haspopup="true" aria-label="Account">${esc(initials(ME.name))}</button></div></div></header>`;
}

async function loadTeam() {
  const [p, g] = await Promise.all([
    sb.from('team_profiles').select('*').order('created_at'),
    sb.from('team_groups').select('*').order('created_at'),
  ]);
  TEAM.people = (p.data || []).sort((a, b) => (b.is_super - a.is_super) || ((b.role === 'admin') - (a.role === 'admin')) || String(a.name).localeCompare(String(b.name)));
  TEAM.groups = g.error ? [] : (g.data || []);
  TEAM.ready = !g.error && ME.permsReady;
}

function effective(u, k) {
  if (u.is_super) return true;
  const own = (u.perms || {})[k]; if (typeof own === 'boolean') return own;
  const grp = TEAM.groups.find(x => x.id === u.group_id); const gv = grp && (grp.perms || {})[k];
  if (typeof gv === 'boolean') return gv;
  return defaultPerm(u, k);
}
const groupOf = u => TEAM.groups.find(x => x.id === u.group_id);
const chip = g => g ? `<span class="gchip" style="--c:${esc(g.color)}">${esc(g.name)}</span>` : '';
const canEdit = u => ME.isAdmin && !(u.is_super && !ME.isSuper);
const canRemove = u => ME.isAdmin && !u.is_super && u.id !== ME.id;

async function viewTeam() {
  app.innerHTML = topbar() + `<main class="page"><section class="hello"><div><p class="eyebrow"><a href="index.html">&larr; Portal</a></p><h1>Team &amp; permissions</h1><p>${ME.isAdmin ? 'Add people, sort them into groups and choose exactly what each person can see and do.' : 'Everyone on the TORQ team.'}</p></div>
${ME.isAdmin ? `<div class="btn-row"><button class="btn" data-a="new-group">${I.plus} New group</button><button class="btn primary" data-a="new-person">${I.plus} Add member</button></div>` : ''}</section>
<div id="team-body"><div class="skel" style="height:260px"></div></div></main>`;
  $('#meBtn').onclick = e => { e.stopPropagation(); toggleMenu(); };
  await loadTeam();
  renderTeam();
  app.onclick = teamClick;
}

function renderTeam() {
  const el = $('#team-body'); if (!el) return;
  const warn = ME.isAdmin && !TEAM.ready ? `<div class="err show" style="margin-bottom:14px">Permissions aren't switched on in the database yet. Run <b>team-permissions.sql</b> in Supabase (SQL Editor), then refresh this page.</div>` : '';
  const tabs = `<div class="seg"><button class="${TEAM.tab === 'people' ? 'on' : ''}" data-tab="people">People <span>${TEAM.people.length}</span></button><button class="${TEAM.tab === 'groups' ? 'on' : ''}" data-tab="groups">Groups <span>${TEAM.groups.length}</span></button></div>`;
  if (TEAM.tab === 'groups') { el.innerHTML = warn + tabs + groupsHTML(); return; }
  const q = TEAM.q.toLowerCase();
  const list = TEAM.people.filter(u => !q || [u.name, u.email, groupOf(u)?.name, roleLabel(u)].join(' ').toLowerCase().includes(q));
  el.innerHTML = warn + tabs + `<label class="search">${I.search}<input id="tq" type="search" placeholder="Search people" value="${esc(TEAM.q)}"></label>
<div class="people">${list.map((u, i) => {
    const on = PERM_KEYS.filter(k => effective(u, k));
    const areas = PERMS.filter(g => g.items.some(([k]) => on.includes(k))).map(g => g.group);
    return `<div class="person" style="--i:${i}"><span class="avatar">${esc(initials(u.name))}</span>
<div class="pinfo"><b>${esc(u.name)}${u.id === ME.id ? ' <em>(you)</em>' : ''}</b><span>${esc(u.email || '')}</span>
<div class="ptags"><span class="rtag ${u.is_super ? 'super' : u.role === 'admin' ? 'admin' : ''}">${u.is_super ? I.crown : ''}${esc(roleLabel(u))}</span>${chip(groupOf(u))}${Object.keys(u.perms || {}).length && !u.is_super ? '<span class="custom">Custom</span>' : ''}</div>
<p class="areas">${u.is_super ? 'Full access to everything · can never be removed' : areas.length ? 'Access: ' + esc(areas.join(', ')) : 'No access yet'}</p></div>
<div class="pacts">${canEdit(u) ? `<button class="btn sm" data-edit="${u.id}">${I.edit} ${ME.isAdmin && !u.is_super ? 'Permissions' : 'Edit'}</button>` : ''}${canRemove(u) ? `<button class="icon-btn danger" data-remove="${u.id}" aria-label="Remove ${esc(u.name)}">${I.trash}</button>` : ''}${u.is_super ? `<span class="lock" title="Super admin can't be removed">${I.lock}</span>` : ''}</div></div>`;
  }).join('') || '<div class="empty">No one matches that search.</div>'}</div>`;
  const tq = $('#tq'); tq.oninput = () => { TEAM.q = tq.value; const pos = tq.selectionStart; renderTeam(); const n = $('#tq'); n.focus(); n.setSelectionRange(pos, pos); };
}

function groupsHTML() {
  if (!TEAM.groups.length) return `<div class="empty">No groups yet.${ME.isAdmin ? ' Groups let you set permissions once for a whole crew (like "Sponsor Team" or "Check-in Staff") and put people in them.' : ''}</div>`;
  return `<div class="groups">${TEAM.groups.map((g, i) => {
    const n = TEAM.people.filter(u => u.group_id === g.id);
    const on = PERM_KEYS.filter(k => (g.perms || {})[k] === true);
    return `<div class="group" style="--i:${i};--c:${esc(g.color)}"><div class="gtop"><span class="gdot"></span><b>${esc(g.name)}</b><span class="muted small">${n.length} ${n.length === 1 ? 'person' : 'people'}</span>
${ME.isAdmin ? `<span class="gacts"><button class="btn sm" data-gedit="${g.id}">${I.edit} Edit</button><button class="icon-btn danger" data-gdel="${g.id}" aria-label="Delete group">${I.trash}</button></span>` : ''}</div>
<div class="gperms">${PERMS.map(sec => sec.items.map(([k, label]) => `<span class="gp ${on.includes(k) ? 'on' : ''}">${on.includes(k) ? I.check : I.x}${esc(label)}</span>`).join('')).join('')}</div>
<div class="faces">${n.map(u => `<span class="avatar xs" title="${esc(u.name)}">${esc(initials(u.name))}</span>`).join('')}</div></div>`;
  }).join('')}</div>`;
}

async function teamClick(e) {
  const b = e.target.closest('button,[data-tab]'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { TEAM.tab = d.tab; renderTeam(); return; }
  if (d.a === 'new-person') return personSheet(null);
  if (d.a === 'new-group') return groupSheet(null);
  if (d.edit) return personSheet(TEAM.people.find(u => u.id === d.edit));
  if (d.gedit) return groupSheet(TEAM.groups.find(g => g.id === d.gedit));
  if (d.remove) {
    const u = TEAM.people.find(x => x.id === d.remove);
    if (!await confirmSheet(`Remove ${u.name}?`, `${u.name} loses access to the portal and every team page right away. You can add them back later.`, 'Remove from team')) return;
    const { error } = await sb.from('team_profiles').delete().eq('id', u.id);
    if (error) return toast(friendly(error), 'err');
    toast(`${u.name} removed`, 'ok'); await loadTeam(); renderTeam(); return;
  }
  if (d.gdel) {
    const g = TEAM.groups.find(x => x.id === d.gdel);
    if (!await confirmSheet(`Delete the ${g.name} group?`, 'People in it stay on the team and fall back to their own settings and the defaults for their role.', 'Delete group')) return;
    const { error } = await sb.from('team_groups').delete().eq('id', g.id);
    if (error) return toast(friendly(error), 'err');
    toast('Group deleted', 'ok'); await loadTeam(); renderTeam();
  }
}

function friendly(err) {
  const m = String(err?.message || err || '');
  if (/super admin/i.test(m)) return m;
  if (/row-level security|permission/i.test(m)) return "You don't have permission to do that.";
  if (/already registered|already been registered|exists/i.test(m)) return 'That email already has an account.';
  return m || 'Something went wrong. Try again.';
}

function sheet(html, wide) {
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}">${html}</div>`;
  document.body.appendChild(w);
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) w.remove(); });
  return w;
}
function confirmSheet(title, body, ok) {
  return new Promise(res => {
    const w = sheet(`<h3>${esc(title)}</h3><p class="sub">${esc(body)}</p><div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn danger-fill" id="ok">${esc(ok)}</button></div>`);
    const done = v => { w.remove(); res(v); };
    $('#ok', w).onclick = () => done(true);
    w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) res(false); });
  });
}

// three-way switch per permission: Default / Allow / Block
function permGrid(state, baseFn, opts = {}) {
  return PERMS.map(sec => `<div class="pg"><div class="pg-h">${I[sec.icon]}<b>${esc(sec.group)}</b></div>${sec.items.map(([k, label]) => {
    const v = state[k]; const base = baseFn(k);
    const choices = opts.twoWay ? [['on', 'Allow'], ['off', 'Block']] : [['', `Default · ${base ? 'Allowed' : 'Blocked'}`], ['on', 'Allow'], ['off', 'Block']];
    const cur = v === true ? 'on' : v === false ? 'off' : '';
    return `<div class="prow"><span>${esc(label)}</span><div class="tri" data-k="${k}">${choices.map(([val, t]) => `<button type="button" class="${cur === val ? 'sel v-' + (val || 'def') : ''}" data-v="${val}">${t}</button>`).join('')}</div></div>`;
  }).join('')}</div>`).join('');
}
function bindGrid(root, state, onChange) {
  root.querySelectorAll('.tri').forEach(tri => tri.onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const k = tri.dataset.k, v = b.dataset.v;
    if (v === 'on') state[k] = true; else if (v === 'off') state[k] = false; else delete state[k];
    tri.querySelectorAll('button').forEach(x => x.className = x === b ? 'sel v-' + (v || 'def') : '');
    onChange && onChange();
  });
}

function personSheet(u) {
  const isNew = !u, lockedRole = u && u.is_super;
  const state = { ...(u?.perms || {}) };
  const roleSel = u?.role === 'admin' || u?.is_super ? 'admin' : 'reviewer';
  const groupOpts = `<option value="">No group</option>` + TEAM.groups.map(g => `<option value="${g.id}" ${u?.group_id === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  const w = sheet(`<form id="pf"><h3>${isNew ? 'Add a team member' : esc(u.name)}</h3><p class="sub">${isNew ? 'They sign in at this portal with the email and password you set here. Share the password with them privately.' : esc(u.email || '')}</p>
<div class="grid2"><label class="fld"><span>Full name</span><input class="inp" id="p-name" value="${esc(u?.name || '')}" required></label>
${isNew ? `<label class="fld"><span>Email</span><input class="inp" id="p-email" type="email" autocomplete="off" required></label>` : ''}</div>
${isNew ? `<label class="fld"><span>Temporary password</span><input class="inp" id="p-pass" type="text" minlength="8" value="${esc(tempPass())}" required><small class="muted">They can change it from their account menu after signing in.</small></label>` : ''}
${lockedRole ? `<div class="supernote">${I.crown} Super admin: full access to everything. This account can't be removed or downgraded.</div>` : `
<div class="grid2"><label class="fld"><span>Role</span><select class="inp" id="p-role"><option value="reviewer" ${roleSel === 'reviewer' ? 'selected' : ''}>Team member: can't add or remove people</option><option value="admin" ${roleSel === 'admin' ? 'selected' : ''}>Admin: can manage the team</option></select></label>
<label class="fld"><span>Group</span><select class="inp" id="p-group">${groupOpts}</select></label></div>
<h4 class="ph">What ${isNew ? 'they' : esc(u.name.split(' ')[0])} can see and do</h4><p class="muted small" style="margin:-4px 0 10px">"Default" follows their group, or the standard for their role when they're not in a group.</p>
<div id="grid"></div>`}
<div class="err" id="perr"></div>
<div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="psave">${isNew ? 'Add member' : 'Save changes'}</button></div></form>`, true);
  const draw = () => {
    if (lockedRole) return;
    const fake = { role: $('#p-role', w).value, group_id: $('#p-group', w).value || null, perms: {} };
    $('#grid', w).innerHTML = permGrid(state, k => effective(fake, k));
    bindGrid($('#grid', w), state);
  };
  if (!lockedRole) { draw(); $('#p-role', w).onchange = draw; $('#p-group', w).onchange = draw; }
  $('#pf', w).onsubmit = async e => {
    e.preventDefault();
    const btn = $('#psave', w), er = $('#perr', w); btn.disabled = true; er.classList.remove('show');
    const fail = m => { er.textContent = m; er.classList.add('show'); btn.disabled = false; };
    const name = $('#p-name', w).value.trim(); if (!name) return fail('Add their name.');
    const row = { name };
    if (!lockedRole) { row.role = $('#p-role', w).value; row.group_id = $('#p-group', w).value || null; row.perms = state; }
    if (!TEAM.ready) { delete row.group_id; delete row.perms; }
    if (isNew) {
      const email = $('#p-email', w).value.trim().toLowerCase(), pass = $('#p-pass', w).value;
      if (pass.length < 8) return fail('Use a password with at least 8 characters.');
      const temp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'torq-temp-signup' } });
      const { data, error } = await temp.auth.signUp({ email, password: pass });
      if (error) return fail(friendly(error));
      if (!data.user || (data.user.identities && data.user.identities.length === 0)) return fail('That email already has an account. If they used to be on the team, ask them for their password or have them sign in once.');
      const ins = await sb.from('team_profiles').insert({ id: data.user.id, email, ...row });
      if (ins.error) return fail(friendly(ins.error));
      w.remove(); toast(`${name} added to the team`, 'ok');
    } else {
      const up = await sb.from('team_profiles').update(row).eq('id', u.id);
      if (up.error) return fail(friendly(up.error));
      w.remove(); toast('Saved', 'ok');
      if (u.id === ME.id) { const me = await loadMe((await sb.auth.getSession()).data.session); if (me) ME = me; }
    }
    await loadTeam(); renderTeam();
  };
}

function groupSheet(g) {
  const isNew = !g;
  const state = {}; PERM_KEYS.forEach(k => state[k] = g ? (g.perms || {})[k] === true : MEMBER_DEFAULT.includes(k));
  let color = g?.color || COLORS[TEAM.groups.length % COLORS.length];
  const w = sheet(`<form id="gf"><h3>${isNew ? 'New group' : 'Edit ' + esc(g.name)}</h3><p class="sub">Everyone in this group gets these permissions. You can still change any single person's access from their own settings.</p>
<label class="fld"><span>Group name</span><input class="inp" id="g-name" value="${esc(g?.name || '')}" placeholder="e.g. Sponsor Team, Check-in Staff" required></label>
<div class="fld"><span>Color</span><div class="swatches">${COLORS.map(c => `<button type="button" class="sw ${c === color ? 'on' : ''}" style="--c:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
<h4 class="ph">What this group can see and do</h4><div id="ggrid"></div>
<div class="err" id="gerr"></div>
<div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="gsave">${isNew ? 'Create group' : 'Save group'}</button></div></form>`, true);
  $('#ggrid', w).innerHTML = permGrid(state, () => false, { twoWay: true });
  bindGrid($('#ggrid', w), state);
  $('.swatches', w).onclick = e => { const s = e.target.closest('[data-c]'); if (!s) return; color = s.dataset.c; $$('.sw', w).forEach(x => x.classList.toggle('on', x === s)); };
  $('#gf', w).onsubmit = async e => {
    e.preventDefault();
    const er = $('#gerr', w), btn = $('#gsave', w); btn.disabled = true;
    const name = $('#g-name', w).value.trim(); if (!name) { er.textContent = 'Give the group a name.'; er.classList.add('show'); btn.disabled = false; return; }
    const perms = {}; PERM_KEYS.forEach(k => perms[k] = state[k] === true);
    const r = isNew ? await sb.from('team_groups').insert({ name, color, perms }) : await sb.from('team_groups').update({ name, color, perms }).eq('id', g.id);
    if (r.error) { er.textContent = friendly(r.error); er.classList.add('show'); btn.disabled = false; return; }
    w.remove(); toast(isNew ? 'Group created' : 'Group saved', 'ok'); TEAM.tab = 'groups'; await loadTeam(); renderTeam();
  };
}
function tempPass() { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = 'Torq-'; for (const x of crypto.getRandomValues(new Uint8Array(8))) s += a[x % a.length]; return s; }

// keep the portal in sync if you sign out in another tab or team page
sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT' && ME) { ME = null; viewLogin(); } });
boot();
</script>
</body>
</html>
