<style>
/* TORQ Check-In — showcaser passes + team scanner
   Layout: centered pass column for showcasers · full-width scanner/console for the team */
:root{
  --bg:#0b0b0d; --bg2:#101014; --card:#15151a; --card2:#1c1c23; --card3:#24242d;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f4f4f6; --muted:#9a9aa6; --dim:#66666f;
  --red:#ff2d2d; --red2:#ff5a36; --redglow:rgba(255,45,45,.32); --redbg:rgba(255,45,45,.11);
  --green:#2ee59d; --greenbg:rgba(46,229,157,.12); --amber:#ffb020; --amberbg:rgba(255,176,32,.12);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Sora','Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 520px at 85% -12%,rgba(255,45,45,.15),transparent 62%),radial-gradient(700px 420px at -12% 110%,rgba(255,90,54,.07),transparent 60%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .hidden{display:none!important}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:8px}
svg{flex:none}

/* logo */
.logo{display:inline-grid;justify-items:center;gap:.55em;line-height:1}
.logo img{display:block;width:100%;height:auto}
.logo .tag{display:flex;align-items:center;gap:.9em;width:100%;font:500 .95em var(--display);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase}
.logo .tag::before,.logo .tag::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
.logo .tag::after{background:linear-gradient(270deg,transparent,var(--red))}
.logo.anim img{clip-path:inset(0 100% 0 0);transform:translateX(-20px) skewX(-10deg);filter:blur(4px);animation:wipe .75s var(--ease) .1s forwards}
.logo.anim .tag{opacity:0;letter-spacing:1.3em;animation:tagIn .8s var(--ease) .7s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0);transform:none;filter:none}}
@keyframes tagIn{to{opacity:1;letter-spacing:.5em}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,229,157,.55)}70%{box-shadow:0 0 0 14px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line2);transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--card3)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--red2),var(--red));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px var(--redglow)}
.btn.go{background:var(--green);border-color:transparent;color:#03150d}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.big{height:56px;font-size:16px;width:100%}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--card2);color:var(--text)} .icon-btn svg{width:19px;height:19px}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--red);animation:spin .7s linear infinite;display:inline-block}
.spinner.sm{width:15px;height:15px;border-width:2px;vertical-align:-3px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;height:52px;padding:0 15px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);outline:0;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;min-height:70px;padding:12px 15px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 15px) 23px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
.err{display:none;padding:11px 13px;border-radius:12px;background:var(--redbg);border:1px solid rgba(255,45,45,.3);color:#ffb3b3;font-size:14px;margin-bottom:12px}
.err.show{display:block;animation:shake .35s}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);background:var(--card2)}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--greenbg);color:var(--green);border-color:rgba(46,229,157,.3)}
.pill.wait{background:var(--amberbg);color:var(--amber);border-color:rgba(255,176,32,.3)}
.zone{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.zone::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(11,11,13,.82);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{height:21px;width:auto}
.brand .tagpill{font:600 10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:5px 9px 5px 10px;border-radius:5px;background:var(--red);color:#fff;transform:skewX(-12deg)}
.brand .tagpill b{display:inline-block;transform:skewX(12deg);font-weight:600}
.tb-r{display:flex;align-items:center;gap:6px}

/* public */
.wrap{max-width:540px;margin:0 auto;padding-block:26px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.hero{text-align:center;display:grid;justify-items:center;gap:16px;padding-top:10px}
.hero .logo{width:min(250px,64vw);font-size:clamp(12px,3.4vw,15px)}
.hero h1{font-size:clamp(26px,6.6vw,34px);text-transform:uppercase;letter-spacing:.01em}
.hero p{color:var(--muted);max-width:400px}
.card{padding:20px;border-radius:22px;background:var(--card);border:1px solid var(--line);animation:rise .45s var(--ease) both}
.find h2{font-size:18px;margin-bottom:4px}
.find .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.foot{text-align:center;color:var(--dim);font-size:12.5px}
.foot a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2)}

/* pass */
.pass{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#19191f,#121216);border:1px solid var(--line2);box-shadow:0 30px 70px -30px rgba(0,0,0,.9);animation:passIn .7s var(--spring) both}
@keyframes passIn{from{opacity:0;transform:translateY(30px) scale(.94) rotate(-1deg)}}
.pass::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--red2),var(--red))}
.pass-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 22px 0}
.pass-top img{height:24px;width:auto}
.pass-top .kicker{font:600 10.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--red2);text-align:right}
.pass-ev{padding:14px 22px 0}
.pass-ev h2{font-size:24px;text-transform:uppercase;letter-spacing:.01em}
.pass-ev p{color:var(--muted);font-size:13.5px;margin-top:3px}
.qrbox{position:relative;margin:18px auto 0;width:min(270px,74%);aspect-ratio:1;padding:14px;border-radius:20px;background:#fff;display:grid;place-items:center;transition:filter .4s}
.qrbox canvas,.qrbox img{width:100%!important;height:100%!important;image-rendering:pixelated}
.qrbox .done{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;align-content:center;gap:6px;background:rgba(6,40,26,.9);color:var(--green);font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;animation:pop .45s var(--spring)}
.qrbox .done span.ck{width:72px;height:72px;border-radius:50%;background:var(--green);color:#03150d;display:grid;place-items:center;animation:pulse 1.6s 2}
.qrbox .done span.ck svg{width:40px;height:40px}
.code{text-align:center;font:600 13px var(--mono);letter-spacing:.2em;color:var(--dim);margin-top:10px}
.perf{position:relative;height:28px;margin:12px 0 0}
.perf::before{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:2px dashed var(--line2)}
.perf::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 50%,var(--bg) 13px,transparent 14px),radial-gradient(circle at 100% 50%,var(--bg) 13px,transparent 14px)}
.pass-who{padding:4px 22px 22px;display:grid;gap:14px}
.who-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap}
.who-row .lab{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.who-row b{font-size:17px}
.carnum{font:700 30px/1 var(--display);color:var(--amber)}
.park{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.park>div{padding:11px 13px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.park .lab{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.park b{font-size:15.5px}
.park .vip{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--bg2))}
.park .vip b{color:var(--c)}
.pnote{padding:11px 13px;border-radius:14px;background:var(--amberbg);color:#ffd27a;font-size:14px;border:1px solid rgba(255,176,32,.25)}
.pass-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tips{font-size:13px;color:var(--muted);text-align:center}
.multi-note{font-size:13.5px;color:var(--muted);text-align:center}

/* schedule */
.sched h3{font-size:20px;text-transform:uppercase;letter-spacing:.01em}
.sched .eyebrow{font:600 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--red2);margin-bottom:6px}
.tl{display:grid;gap:10px;margin-top:14px}
.ti{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--card2);border-left:3px solid #fff;animation:rise .4s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.ti.alert{border-left-color:var(--red)}
.ti .t{font:700 24px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.ti .t small{font:600 11px var(--mono);color:var(--muted);margin-left:3px;letter-spacing:.05em}
.ti b{display:block;font:600 14.5px var(--display);text-transform:uppercase;letter-spacing:.04em}
.ti.alert b{color:#ff6b6b}
.ti p{font-size:13px;color:var(--muted);margin-top:2px}
.ti.now{box-shadow:0 0 0 1px var(--green) inset}
.ti .nowtag{font:600 10px var(--mono);color:var(--green);letter-spacing:.14em;margin-left:6px}
.notes{margin-top:14px;display:grid}
.notes div{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.notes div:first-child{border-top:0}
.notes i{font:700 15px var(--display);font-style:normal;color:var(--muted)}
@media(max-width:420px){.ti{grid-template-columns:78px 1fr;padding:12px 13px}.ti .t{font-size:20px}}

/* team */
.page{max-width:1100px;margin:0 auto;padding-block:20px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.t-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.t-head h1{font-size:clamp(24px,4vw,32px)}
.t-head .eyebrow{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--red2);margin-bottom:6px}
.t-head select{height:44px;font-size:14px;max-width:100%}
.prog{display:grid;gap:8px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog-top b{font:600 28px var(--display);font-variant-numeric:tabular-nums}
.prog-top b span{font-size:16px;color:var(--muted)}
.bar{height:9px;border-radius:9px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#1fbf7f,var(--green));transition:width .8s var(--ease)}
.zcounts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--card3);color:var(--text)}

/* scanner */
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.scan-grid{grid-template-columns:1fr}}
.cam{position:relative;aspect-ratio:1;max-height:70vh;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line2)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:14%;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.cam .frame::before,.cam .frame::after{content:"";position:absolute;inset:0;border-radius:22px;border:3px solid transparent;border-image:none}
.cam .corner{position:absolute;width:44px;height:44px;border:4px solid #fff;border-radius:6px}
.cam .c1{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:22px}
.cam .c2{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:22px}
.cam .c3{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:22px}
.cam .c4{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:22px}
.cam .laser{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 12px var(--red);animation:laser 2s ease-in-out infinite}
@keyframes laser{0%,100%{top:10%}50%{top:88%}}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1b1b22,#0b0b0d)}
.cam .off>svg{width:46px;height:46px;color:var(--red2)}
.cam .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;font-weight:600;text-shadow:0 1px 4px #000}
.cam.flash-ok{box-shadow:0 0 0 4px var(--green)} .cam.flash-warn{box-shadow:0 0 0 4px var(--amber)}
.side{display:grid;gap:12px}
.manual{display:flex;gap:8px}
.manual .inp{height:46px;font-size:15px}
.auto{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.switch{position:relative;width:50px;height:29px;border-radius:30px;background:var(--card3);border:1px solid var(--line2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.switch.on{background:var(--green);border-color:var(--green)} .switch.on::after{transform:translateX(21px)}
.recent{display:grid;gap:8px}
.recent .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;animation:rise .3s var(--ease)}
.recent .r b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .r span{color:var(--dim);font-size:12px;white-space:nowrap}

/* result sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:24px;background:var(--bg2);border:1px solid var(--line2);animation:rise .3s var(--ease)}
.sheet.pad{padding:22px}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.res-photo{aspect-ratio:16/10;background:var(--card2);position:relative}
.res-photo img{width:100%;height:100%;object-fit:cover;display:block}
.res-photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)} .res-photo .ph svg{width:60px;height:60px}
.res-status{position:absolute;left:14px;top:14px}
.res-body{padding:18px 20px 20px;display:grid;gap:12px}
.res-body h2{font-size:24px}
.plate{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:9px;background:#f4f4f6;color:#111;font:700 20px var(--mono);letter-spacing:.12em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.kv span{display:block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kv b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14.5px}
.res-banner svg{width:20px;height:20px}
.res-banner.ok{background:var(--greenbg);color:var(--green);border:1px solid rgba(46,229,157,.3)}
.res-banner.warn{background:var(--amberbg);color:var(--amber);border:1px solid rgba(255,176,32,.3)}
.res-banner.bad{background:var(--redbg);color:#ff8a8a;border:1px solid rgba(255,45,45,.3)}
.res-acts{display:grid;gap:8px}
.bigcheck{display:grid;place-items:center;align-content:center;gap:12px;padding:30px 20px;text-align:center}
.bigcheck .ck{width:110px;height:110px;border-radius:50%;background:var(--green);color:#03150d;display:grid;place-items:center;animation:pop .45s var(--spring),pulse 1.4s .2s}
.bigcheck .ck svg{width:60px;height:60px}
.bigcheck h2{font-size:26px;text-transform:uppercase}

/* list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.search svg{width:17px;height:17px;color:var(--dim)} .search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);animation:rise .3s var(--ease) both;animation-delay:calc(min(var(--i),14)*25ms)}
.row.in{border-color:rgba(46,229,157,.28);background:linear-gradient(90deg,rgba(46,229,157,.06),var(--card) 50%)}
.row .num{font:700 15px var(--mono);color:var(--amber);min-width:38px;text-align:center}
.row b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.row .acts{display:flex;gap:6px;align-items:center}
@media(max-width:600px){.row{grid-template-columns:auto minmax(0,1fr)}.row .acts{grid-column:1/-1}.row .acts .btn{flex:1}}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* schedule editor */
.ed-item{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:start;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.ed-item .inp{height:44px;font-size:14px}
.ed-item textarea.inp{min-height:44px;height:44px}
@media(max-width:600px){.ed-item{grid-template-columns:1fr}}
.ed-acts{display:flex;gap:4px;flex-wrap:wrap}
.ed-note{display:flex;gap:8px;margin-bottom:8px}
.ed-note .inp{height:44px;font-size:14px}
.zone-ed{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.zone-ed input[type=color]{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);padding:4px}
.sec{display:grid;gap:10px}
.sec h3{font-size:17px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;height:44px}
.check input{width:18px;height:18px;accent-color:var(--red)}

/* login */
.center{min-height:calc(100dvh - 70px);display:grid;place-items:center;padding:24px 16px}
.login{width:min(420px,100%);display:grid;gap:24px;animation:rise .5s var(--ease)}
.login .logo{width:min(260px,72%);justify-self:center;font-size:clamp(12px,3.4vw,15px)}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{max-width:420px;padding:11px 16px;border-radius:13px;background:var(--card3);border:1px solid var(--line2);font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);animation:rise .3s var(--spring)}
.toast.ok{background:#0f2b20;border-color:rgba(46,229,157,.35);color:#b7f5da}
.toast.err{background:#3a1416;border-color:rgba(255,45,45,.4);color:#ffc7c7}
.skel{border-radius:16px;background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}
@media(max-width:600px){
  .sheet-wrap{align-items:end;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .t-head select{width:100%}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

/* ---------- helpers ---------- */

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  check: sv('<path d="M20 6L9 17l-5-5"/>'),

function toast(msg, type = '') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), 3400); }
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { } }, del(k) { try { localStorage.removeItem(k); } catch { } } };
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
const qrUrl = token => CFG.publicUrl.replace(/\/?$/, '/') + '#/scan/' + token;
const shortCode = token => String(token).slice(-6).toUpperCase();
const logoHTML = (tag, cls = '') => `<span class="logo ${cls}"><img src="${LOGO}" alt="TORQ"><span class="tag">${tag}</span></span>`;
let polls = [];
const stopPolls = () => { polls.forEach(clearInterval); polls = []; };
function every(ms, fn) { const id = setInterval(() => { if (!document.hidden) fn(); }, ms); polls.push(id); return id; }
function beep(ok = true) {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = ok ? 880 : 300; g.gain.setValueAtTime(.2, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + (ok ? .25 : .45)); o.start(); o.stop(a.currentTime + .5); } catch { }
  try { navigator.vibrate?.(ok ? [40, 40, 60] : [200, 80, 200]); } catch { }
}
function makeQR(el, text) { el.innerHTML = ''; new QRCode(el, { text, width: 600, height: 600, colorDark: '#0b0b0d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }

/* ---------- router ---------- */
function route() {
  stopPolls(); stopCamera(); $$('.sheet-wrap').forEach(s => s.remove());
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('scan/')) return viewScanLink(h.slice(5));
  if (h === 'team' || h.startsWith('team/')) return viewTeam(h.split('/')[1] || 'scan');
  if (TEAM_HOME) { location.replace('#/team'); return; }
  viewPublic();
}
addEventListener('hashchange', () => { scrollTo(0, 0); route(); });

/* =================================================================
   PUBLIC: get my pass
   ================================================================= */
let SCHED = {};
async function loadSchedule(eventId) {
  if (SCHED[eventId] !== undefined) return SCHED[eventId];
  const { data } = await sb.from('checkin_schedules').select('*').eq('event_id', eventId).maybeSingle();
  return SCHED[eventId] = data || null;
}

function publicShell(inner) {
  return `<header class="topbar"><a class="brand" href="#/" aria-label="TORQ Check-In"><img src="${LOGO}" alt="TORQ"><span class="tagpill"><b>Check-In</b></span></a><div class="tb-r"></div></header><main class="wrap">${inner}</main>`;
}

function viewPublic() {
  document.title = 'TORQ Check-In';
  const saved = ls.get('torq-checkin-contact');
  app.innerHTML = publicShell(`<section class="hero">${logoHTML('Check-In', 'anim')}<h1>Showcase check-in pass</h1><p>Approved showcase cars only. Enter the email or phone number you used on your vehicle submission to get your QR pass.</p></section>
<section class="card find" id="find"><form id="ff"><label class="fld"><span>Email or phone number</span><input class="inp" id="contact" autocomplete="email" inputmode="email" placeholder="you@email.com or (404) 555-0123" value="${esc(saved || '')}" required></label>
<div class="err" id="ferr"></div><button class="btn primary big" id="fgo" type="submit">${I.qr} Get my pass</button></form></section>
<section id="out" class="hidden" style="display:grid;gap:22px"></section>
<p class="foot">Need help? Find a TORQ staff member at the entrance.<br><a href="#/team">Team sign-in</a></p>`);
  $('#contact').addEventListener('input', e => { const v = e.target.value; e.target.inputMode = /^[\d\s()+-]+$/.test(v) && v ? 'tel' : 'email'; });

async function findPass(contact, silent) {
  const btn = $('#fgo'), err = $('#ferr'); contact = contact.trim();
  if (!contact) return;
  err.classList.remove('show'); btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Finding your pass…';
  const { data, error } = await sb.rpc('checkin_get_pass', { p_contact: contact });
  btn.disabled = false; btn.innerHTML = `${I.qr} Get my pass`;
  if (error) { err.textContent = "We couldn't reach TORQ right now. Check your signal and try again."; err.classList.add('show'); return; }
  if (!data || !data.length) {
    if (silent) { ls.del('torq-checkin-contact'); return; }
    err.innerHTML = "We couldn't find an <b>approved</b> car for that email or phone. Use the same one you put on your vehicle submission. If your car is still pending, you'll get a pass once TORQ approves it.";
    err.classList.add('show'); return;
  }
  ls.set('torq-checkin-contact', contact);
  $('#find').classList.add('hidden');

}

async function renderPasses(passes) {
  const out = $('#out'); out.classList.remove('hidden');
  const scheds = {};
  for (const p of passes) if (p.event_id) scheds[p.event_id] = await loadSchedule(p.event_id);
  out.innerHTML = (passes.length > 1 ? `<p class="multi-note">You have ${passes.length} approved cars. Each one has its own pass.</p>` : '') +
    passes.map((p, i) => passHTML(p, i, scheds[p.event_id])).join('') +
    `<p class="tips">${I.sun.replace('<svg', '<svg width="15" style="vertical-align:-3px"')} Turn your screen brightness up at the gate. Save the pass to your photos in case you lose signal.</p>
<button class="btn ghost" id="notme">Use a different email or phone</button>` +
    [...new Set(passes.map(p => p.event_id))].map(id => scheduleHTML(scheds[id], passes.find(p => p.event_id === id))).join('');
  passes.forEach((p, i) => makeQR($(`#qr-${i}`), qrUrl(p.token)));
  $('#notme').onclick = () => { ls.del('torq-checkin-contact'); viewPublic(); };
  out.onclick = e => { const b = e.target.closest('[data-save]'); if (b) savePass(passes[+b.dataset.save], +b.dataset.save, scheds[passes[+b.dataset.save].event_id]); };
  // live: flip to "Checked in" when staff scan it
  every(12000, async () => {
    for (let i = 0; i < passes.length; i++) {
      if (passes[i].checked_in_at) continue;
      const { data } = await sb.rpc('checkin_pass_status', { p_token: passes[i].token });
      if (data) { passes[i].checked_in_at = data; markPassDone(i, data); beep(true); }
    }
  });
  scrollTo({ top: 0, behavior: 'smooth' });
}

function zoneColor(sched, name) { const z = (sched?.zones || []).find(z => z.name.toLowerCase() === String(name).toLowerCase()); return z?.color || '#ffb020'; }

function passHTML(p, i, sched) {

<div class="pass-top"><img src="${LOGO}" alt="TORQ"><div class="kicker">Showcase<br>pass</div></div>

<div class="perf"></div>
<div class="pass-who"><div class="who-row"><div><div class="lab">Showcaser</div><b>${esc(p.first_name || 'Showcaser')}</b><div class="muted small">${esc(p.vehicle)}</div></div>${p.car_number ? `<div style="text-align:right"><div class="lab">Car</div><div class="carnum">#${p.car_number}</div></div>` : ''}</div>
${park.length ? `<div class="park">${park.join('')}</div>` : ''}
${p.note ? `<div class="pnote">${esc(p.note)}</div>` : ''}
<div class="who-row"><span class="pill ${p.checked_in_at ? 'ok' : 'wait'}" id="st-${i}">${p.checked_in_at ? I.check + ' Checked in ' + esc(fmtTime(p.checked_in_at)) : 'Ready to check in'}</span></div>
<div class="pass-acts"><button class="btn" data-save="${i}">${I.dl} Save to photos</button><a class="btn" href="#sched-${esc(p.event_id)}">${I.cal} Schedule</a></div></div></article>`;
}
const doneHTML = at => `<div class="done"><span class="ck">${I.check}</span>Checked in<span class="muted small" style="text-transform:none;font-family:var(--font);font-weight:600">${esc(fmtTime(at))}</span></div>`;
function markPassDone(i, at) {
  const b = $(`#qrb-${i}`); if (b && !$('.done', b)) b.insertAdjacentHTML('beforeend', doneHTML(at));
  const s = $(`#st-${i}`); if (s) { s.className = 'pill ok'; s.innerHTML = I.check + ' Checked in ' + esc(fmtTime(at)); }
}

function parseTime(t) { const m = String(t).match(/^\s*(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])?/); if (!m) return null; let h = +m[1]; const mi = +(m[2] || 0), ap = (m[3] || '').toUpperCase(); if (ap === 'PM' && h < 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h * 60 + mi; }
function scheduleHTML(s, p) {
  if (!s || !(s.items || []).length) return '';
  const today = p && p.event_date && new Date(p.event_date).toDateString() === new Date().toDateString();
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const times = s.items.map(it => parseTime(it.time));
  let cur = -1; if (today) times.forEach((t, k) => { if (t != null && t <= nowMin) cur = k; });
  return `<section class="card sched" id="sched-${esc(s.event_id)}"><p class="eyebrow">${esc(p?.event_name || '')}</p><h3>${esc(s.headline || 'Schedule')}</h3>
<p class="muted small" style="margin-top:4px">${esc([p?.event_date, p?.event_location].filter(Boolean).join(' · '))}</p>
<div class="tl">${s.items.map((it, k) => { const m = String(it.time || '').match(/^(.*?)\s*([AaPp][Mm])$/); return `<div class="ti ${it.alert ? 'alert' : ''} ${k === cur ? 'now' : ''}" style="--i:${k}"><div class="t">${esc(m ? m[1] : it.time)}${m ? `<small>${esc(m[2].toUpperCase())}</small>` : ''}</div><div><b>${esc(it.title)}${k === cur ? '<span class="nowtag">NOW</span>' : ''}</b>${it.detail ? `<p>${esc(it.detail)}</p>` : ''}</div></div>`; }).join('')}</div>
${(s.notes || []).length ? `<p class="eyebrow" style="margin-top:20px">Important notes</p><div class="notes">${s.notes.map((n, k) => `<div><i>${String(k + 1).padStart(2, '0')}</i><span>${esc(n)}</span></div>`).join('')}</div>` : ''}</section>`;
}

/* Save the pass as an image (works offline at the gate) */
async function savePass(p, i, sched) {
  const W = 1080, H = 1700, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
  await (document.fonts?.ready || Promise.resolve());
  x.fillStyle = '#0b0b0d'; x.fillRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#ff5a36'); g.addColorStop(1, '#ff2d2d'); x.fillStyle = g; x.fillRect(0, 0, W, 16);
  const logo = await load(LOGO); if (logo) { const lw = 300, lh = lw * logo.height / logo.width; x.drawImage(logo, (W - lw) / 2, 90, lw, lh); }
  x.textAlign = 'center';
  x.fillStyle = '#ff5a36'; x.font = '600 30px "JetBrains Mono", monospace'; x.fillText('SHOWCASE PASS', W / 2, 250);
  x.fillStyle = '#f4f4f6'; x.font = '700 64px Sora, sans-serif'; x.fillText(String(p.event_name || 'TORQ Showcase').toUpperCase(), W / 2, 335);
  x.fillStyle = '#9a9aa6'; x.font = '500 32px Manrope, sans-serif'; x.fillText([p.event_date, p.event_location].filter(Boolean).join('  ·  '), W / 2, 390);
  x.fillStyle = '#fff'; const qs = 620, qx = (W - qs) / 2, qy = 440; x.beginPath(); x.roundRect ? x.roundRect(qx - 30, qy - 30, qs + 60, qs + 60, 36) : x.rect(qx - 30, qy - 30, qs + 60, qs + 60); x.fill();
  const qc = $(`#qr-${i} canvas`), qi = $(`#qr-${i} img`);
  if (qc) x.drawImage(qc, qx, qy, qs, qs); else if (qi) { const im = await load(qi.src); if (im) x.drawImage(im, qx, qy, qs, qs); }
  x.fillStyle = '#66666f'; x.font = '600 30px "JetBrains Mono", monospace'; x.fillText('CODE ' + shortCode(p.token), W / 2, 1160);
  x.fillStyle = '#f4f4f6'; x.font = '700 54px Sora, sans-serif'; x.fillText(p.first_name || 'Showcaser', W / 2, 1260);
  x.fillStyle = '#9a9aa6'; x.font = '500 36px Manrope, sans-serif'; x.fillText(p.vehicle || '', W / 2, 1315);
  let y = 1400; const parts = [p.car_number ? 'CAR #' + p.car_number : '', p.zone ? String(p.zone).toUpperCase() : '', p.spot ? 'SPOT ' + p.spot : ''].filter(Boolean);
  if (parts.length) { x.fillStyle = zoneColor(sched, p.zone); x.font = '700 44px Sora, sans-serif'; x.fillText(parts.join('   ·   '), W / 2, y); y += 60; }
  if (p.arrival) { x.fillStyle = '#f4f4f6'; x.font = '600 34px Manrope, sans-serif'; x.fillText('Arrive ' + p.arrival, W / 2, y); }
  x.fillStyle = '#66666f'; x.font = '600 26px "JetBrains Mono", monospace'; x.fillText('TORQEVENTS.COM  ·  SHOW THIS AT CHECK-IN', W / 2, H - 70);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = `TORQ-pass-${(p.first_name || 'showcase').replace(/\W+/g, '')}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'TORQ check-in pass' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Pass saved', 'ok');
}

let stream = null, raf = 0, scanBusy = false, lastCode = '', lastAt = 0, recent = [];
const autoOn = () => ls.get('torq-checkin-auto') === '1';
function renderScan() {
  $('#tbody').innerHTML = `<div class="scan-grid"><div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="laser"></span></div>

<div class="side"><div class="auto"><div><b>Check in as soon as it scans</b><div class="muted small">Faster lines. Leave off to confirm the car first.</div></div><button class="switch ${autoOn() ? 'on' : ''}" id="autosw" role="switch" aria-checked="${autoOn()}" aria-label="Check in on scan"></button></div>
<form class="manual" id="mf"><input class="inp" id="mcode" placeholder="Can't scan? Search name, plate or code" autocomplete="off"><button class="btn" type="submit">${I.search}</button></form>
<div><p class="muted small" style="margin:4px 2px 8px">Checked in on this device</p><div class="recent" id="recent">${recentHTML()}</div></div></div></div>`;
  $('#camgo').onclick = startCamera;

}
const recentHTML = () => recent.length ? recent.slice(0, 8).map(r => `<div class="r">${I.check.replace('<svg', '<svg width="16" style="color:var(--green)"')}<b>${esc(r.name)} · ${esc(r.vehicle)}</b><span>${esc(fmtTime(r.at))}</span></div>`).join('') : '<p class="muted small" style="padding:4px 2px">Nobody yet.</p>';

async function loadJsQR() {
  if (window.jsQR) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function startCamera() {
  const off = $('#camoff');
  try {
    await loadJsQR();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    const v = $('#vid'); v.srcObject = stream; await v.play();
    off.classList.add('hidden'); $('#hint').classList.remove('hidden'); ls.set('torq-checkin-cam', '1');
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    let t0 = 0;
    const tick = t => {
      raf = requestAnimationFrame(tick);
      if (scanBusy || t - t0 < 120 || v.readyState < 2) return; t0 = t;
      const s = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)); c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      x.drawImage(v, 0, 0, c.width, c.height);
      const r = window.jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
      if (r && r.data) { const now = Date.now(); if (r.data === lastCode && now - lastAt < 10000) return; lastCode = r.data; lastAt = now; onScan(r.data); }
    };
    raf = requestAnimationFrame(tick);
  } catch (e) {
    console.warn(e);
    off.innerHTML = `${I.warn}<b>Camera not available</b><span class="muted small">Allow camera access for this site in your browser settings, then tap Start camera. You can also search by name or plate on the right.</span><button class="btn primary" id="camgo">${I.cam} Try again</button>`;
    $('#camgo').onclick = startCamera;
  }
}
function stopCamera() { cancelAnimationFrame(raf); raf = 0; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

function onScan(text) {
  const m = String(text).match(/[0-9a-f]{36}/);
  if (!m) { beep(false); flash('warn'); toast("That QR code isn't a TORQ pass.", 'err'); return; }
  openToken(m[0]);
}
function flash(kind) { const c = $('#cam'); if (!c) return; c.classList.add('flash-' + kind); setTimeout(() => c.classList.remove('flash-' + kind), 700); }
function manualFind(q) {
  const s = q.toLowerCase().replace(/^code\s*/, '');
  const hits = LIST.filter(r => [r.full_name, r.plate, r.vehicle, r.phone, r.email, shortCode(r.token), r.car_number ? '#' + r.car_number : ''].join(' ').toLowerCase().includes(s));
  if (/^[0-9a-f]{36}$/.test(s)) return openToken(s);
  if (hits.length === 1) return openToken(hits[0].token);
  TAB = 'cars'; history.replaceState(null, '', '#/team/cars'); $$('.seg button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'cars')); stopCamera(); CARS_Q = q; renderCars();
}

async function openToken(token) {
  scanBusy = true;
  const { data, error } = await sb.rpc('checkin_lookup', { p_token: token });
  const r = data && data[0];
  if (error || !r) { beep(false); flash('warn'); scanBusy = false; toast(error ? "You don't have check-in access, or the connection dropped." : "That pass wasn't found.", 'err'); return; }
  if (r.status !== 'approved') { beep(false); flash('warn'); return resultSheet(r, 'bad'); }
  if (autoOn() && !r.checked_in_at && (!EV || String(r.event_id) === String(EV.id))) { return doCheckIn(r, true); }
  beep(!r.checked_in_at); flash(r.checked_in_at ? 'warn' : 'ok');
  resultSheet(r, r.checked_in_at ? 'already' : 'ready');
}

async function photoUrl(r) {
  if (!r.photos || !r.photos.length) return '';
  try { const { data } = await sb.storage.from('torq-uploads').createSignedUrl(r.photos[0], 600); return data?.signedUrl || ''; } catch { return ''; }
}
async function resultSheet(r, state) {
  $$('.sheet-wrap').forEach(s => s.remove());
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  const wrongEv = EV && String(r.event_id) !== String(EV.id);
  const sched = SCHED[String(r.event_id)];
  const banner = state === 'bad' ? `<div class="res-banner bad">${I.x} This car is <b>&nbsp;${esc(r.status)}&nbsp;</b>, not approved. Don't check it in.</div>`
    : state === 'already' ? `<div class="res-banner warn">${I.warn} Already checked in at ${esc(fmtTime(r.checked_in_at))}${r.checked_in_by_name ? ' by ' + esc(r.checked_in_by_name) : ''}.</div>`
    : wrongEv ? `<div class="res-banner warn">${I.warn} This pass is for ${esc(r.event_name)}, not ${esc(EV.name)}.</div>` : '';
  w.innerHTML = `<div class="sheet"><div class="res-photo" id="rph"><div class="ph">${I.car}</div><span class="res-status pill ${state === 'already' ? 'wait' : state === 'bad' ? '' : 'ok'}">${state === 'already' ? 'Already in' : state === 'bad' ? 'Not approved' : 'Approved'}</span></div>
<div class="res-body"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><h2>${esc(r.full_name)}</h2><p class="muted">${esc(r.vehicle)}</p></div>${r.car_number ? `<div class="carnum">#${r.car_number}</div>` : ''}</div>
${r.plate ? `<div><span class="plate">${esc(r.plate)}</span></div>` : ''}
${r.zone || r.spot || r.arrival ? `<div class="park">${r.zone ? `<div class="vip" style="--c:${esc(zoneColor(sched, r.zone))}"><div class="lab">Parking</div><b>${esc(r.zone)}</b></div>` : ''}${r.spot ? `<div><div class="lab">Spot</div><b>${esc(r.spot)}</b></div>` : ''}${r.arrival ? `<div><div class="lab">Arrival</div><b>${esc(r.arrival)}</b></div>` : ''}</div>` : ''}
${r.note ? `<div class="pnote">${esc(r.note)}</div>` : ''}
<div class="kv"><div><span>Phone</span><b>${esc(r.phone || '–')}</b></div><div><span>Instagram</span><b>${esc(r.social || '–')}</b></div>${r.club ? `<div style="grid-column:1/-1"><span>Club</span><b>${esc(r.club)}</b></div>` : ''}</div>
${banner}
<div class="res-acts">${state === 'ready' ? `<button class="btn go big" id="doin">${I.check} Check in ${esc(r.full_name.split(' ')[0])}</button>` : ''}
${state === 'already' ? `<button class="btn" id="undo">${I.undo} Undo check-in</button>` : ''}
${ME.isAdmin && state !== 'bad' ? `<button class="btn" id="park">${I.pin} Parking & notes</button>` : ''}
<button class="btn ghost" id="close">${state === 'ready' ? 'Cancel' : 'Scan next'}</button></div></div></div>`;
  document.body.appendChild(w);
  const close = () => { w.remove(); scanBusy = false; };
  w.onclick = e => { if (e.target === w) close(); };
  $('#close', w).onclick = close;
  $('#doin', w)?.addEventListener('click', () => { w.remove(); doCheckIn(r); });
  $('#undo', w)?.addEventListener('click', async () => { const { error } = await sb.rpc('checkin_mark', { p_token: r.token, p_checked: false }); if (error) return toast("Couldn't undo. Try again.", 'err'); toast('Check-in undone'); close(); await refreshList(); renderTab(); });
  $('#park', w)?.addEventListener('click', () => { w.remove(); parkingSheet(r, () => { scanBusy = false; }); });
  const u = await photoUrl(r); if (u && $('#rph', w)) $('#rph', w).insertAdjacentHTML('afterbegin', `<img src="${esc(u)}" alt="">`);
}

async function doCheckIn(r, fromAuto) {
  const { data, error } = await sb.rpc('checkin_mark', { p_token: r.token, p_checked: true });
  if (error) { scanBusy = false; beep(false); return toast(/not_approved/.test(error.message) ? "This car isn't approved." : "Couldn't check in. Try again.", 'err'); }
  const row = data && data[0];
  if (row?.was_already) { r.checked_in_at = row.checked_in_at; r.checked_in_by_name = row.checked_in_by_name; beep(false); flash('warn'); return resultSheet(r, 'already'); }
  beep(true); flash('ok');
  recent.unshift({ name: r.full_name, vehicle: r.vehicle, at: row?.checked_in_at || new Date().toISOString() });
  const rc = $('#recent'); if (rc) rc.innerHTML = recentHTML();
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  const sched = SCHED[String(r.event_id)];
  w.innerHTML = `<div class="sheet"><div class="bigcheck"><span class="ck">${I.check}</span><h2>Checked in</h2><p style="font-size:18px;font-weight:700">${esc(r.full_name)}</p><p class="muted">${esc(r.vehicle)}${r.car_number ? ' · #' + r.car_number : ''}</p>
${r.zone || r.spot ? `<span class="zone" style="--c:${esc(zoneColor(sched, r.zone))};height:38px;font-size:16px;padding:0 16px">${esc([r.zone, r.spot && 'Spot ' + r.spot].filter(Boolean).join(' · '))}</span>` : ''}
${r.note ? `<div class="pnote" style="text-align:left">${esc(r.note)}</div>` : ''}<button class="btn primary big" id="next" style="margin-top:6px">${I.cam} Scan next</button></div></div>`;
  document.body.appendChild(w);
  const close = () => { w.remove(); scanBusy = false; };
  $('#next', w).onclick = close; w.onclick = e => { if (e.target === w) close(); };
  setTimeout(() => { if (w.isConnected) close(); }, fromAuto ? 2200 : 3500);
  refreshList();
}

/* ---- cars tab ---- */
let CARS_Q = '', CARS_F = 'all', CARS_Z = '';
function renderCars(quiet) {
  const tb = $('#tbody'); if (!tb) return;
  const keep = document.activeElement?.id === 'cq';
  const sched = SCHED[EV?.id];
  const zones = [...new Set(LIST.map(r => r.zone).filter(Boolean))];
  const q = CARS_Q.toLowerCase();
  let rows = LIST.filter(r => CARS_F === 'all' || (CARS_F === 'in' ? r.checked_in_at : !r.checked_in_at));
  if (CARS_Z) rows = rows.filter(r => r.zone === CARS_Z);
  if (q) rows = rows.filter(r => [r.full_name, r.vehicle, r.plate, r.phone, r.email, shortCode(r.token), r.car_number ? '#' + r.car_number : '', r.zone, r.spot].join(' ').toLowerCase().includes(q));
  tb.innerHTML = `<div class="toolbar"><label class="search">${I.search}<input id="cq" type="search" placeholder="Search name, plate, phone or code" value="${esc(CARS_Q)}"></label>
<div class="filters">${[['all', 'All'], ['wait', 'Not here yet'], ['in', 'Checked in']].map(([k, l]) => `<button class="chip ${CARS_F === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}${zones.map(z => `<button class="chip ${CARS_Z === z ? 'on' : ''}" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div></div>
<div class="rows" style="margin-top:12px">${rows.length ? rows.map((r, i) => `<div class="row ${r.checked_in_at ? 'in' : ''}" style="--i:${quiet ? 0 : i}"><span class="num">${r.car_number ? '#' + r.car_number : '–'}</span>
<div style="min-width:0"><b>${esc(r.full_name)}</b><div class="meta">${esc([r.vehicle, r.plate].filter(Boolean).join(' · '))}</div>
<div class="tags">${r.zone ? `<span class="zone" style="--c:${esc(zoneColor(sched, r.zone))}">${esc(r.zone)}${r.spot ? ' · ' + esc(r.spot) : ''}</span>` : ''}${r.arrival ? `<span class="pill">${esc(r.arrival)}</span>` : ''}${r.checked_in_at ? `<span class="pill ok">${I.check} ${esc(fmtTime(r.checked_in_at))}${r.checked_in_by_name ? ' · ' + esc(r.checked_in_by_name.split(' ')[0]) : ''}</span>` : ''}</div></div>
<div class="acts">${ME.isAdmin ? `<button class="btn sm" data-park="${r.token}">${I.pin} Parking</button>` : ''}${r.checked_in_at ? `<button class="btn sm" data-undo="${r.token}">${I.undo} Undo</button>` : `<button class="btn sm go" data-in="${r.token}">${I.check} Check in</button>`}</div></div>`).join('')
    : `<div class="empty">${LIST.length ? 'No cars match.' : 'No approved cars for this event yet.'}</div>`}</div>`;
  const cq = $('#cq'); cq.oninput = () => { CARS_Q = cq.value; const p = cq.selectionStart; renderCars(true); const n = $('#cq'); n.focus(); n.setSelectionRange(p, p); };
  if (keep) { cq.focus(); }
  tb.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.f) { CARS_F = d.f; return renderCars(); }
    if (d.z !== undefined) { CARS_Z = CARS_Z === d.z ? '' : d.z; return renderCars(); }
    if (d.in) { b.disabled = true; const { error } = await sb.rpc('checkin_mark', { p_token: d.in, p_checked: true }); if (error) { b.disabled = false; return toast("Couldn't check in.", 'err'); } beep(true); toast('Checked in', 'ok'); await refreshList(); renderCars(true); }
    if (d.undo) { const { error } = await sb.rpc('checkin_mark', { p_token: d.undo, p_checked: false }); if (error) return toast("Couldn't undo.", 'err'); toast('Check-in undone'); await refreshList(); renderCars(true); }
    if (d.park) { const r = LIST.find(x => x.token === d.park); parkingSheet(r, () => { }); }
  };
}

/* ---- admin: parking zone, spot, arrival, note for one car ---- */
function parkingSheet(r, after) {
  const sched = SCHED[EV?.id] || {}; const zones = sched.zones || [];
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<form class="sheet pad" id="pf"><h3>Parking & notes</h3><p class="sub">${esc(r.full_name)} · ${esc(r.vehicle)}. The showcaser sees this on their pass, and staff see it when they scan.</p>
<label class="fld"><span>Parking zone</span><select class="inp" id="pz"><option value="">None</option>${zones.map(z => `<option ${z.name === r.zone ? 'selected' : ''}>${esc(z.name)}</option>`).join('')}${r.zone && !zones.some(z => z.name === r.zone) ? `<option selected>${esc(r.zone)}</option>` : ''}</select></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="fld"><span>Spot</span><input class="inp" id="ps" maxlength="20" value="${esc(r.spot || '')}" placeholder="e.g. A3"></label>
<label class="fld"><span>Arrival time</span><input class="inp" id="pa" maxlength="40" value="${esc(r.arrival || '')}" placeholder="e.g. 10:00–10:15 AM"></label></div>
<label class="fld"><span>Note to the showcaser</span><textarea class="inp" id="pn" maxlength="300" placeholder="e.g. Enter through Gate B">${esc(r.note || '')}</textarea></label>
<div class="err" id="perr"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" id="pc">Cancel</button><button class="btn primary" id="psave">Save</button></div></form>`;
  document.body.appendChild(w);
  const close = () => { w.remove(); after && after(); };
  $('#pc', w).onclick = close; w.onclick = e => { if (e.target === w) close(); };
  $('#pf', w).onsubmit = async e => {
    e.preventDefault(); $('#psave', w).disabled = true;
    const { error } = await sb.rpc('checkin_set_details', { p_token: r.token, p_zone: $('#pz', w).value, p_spot: $('#ps', w).value.trim(), p_arrival: $('#pa', w).value.trim(), p_note: $('#pn', w).value.trim() });
    if (error) { $('#perr', w).textContent = /not_allowed/.test(error.message) ? 'Only admins can change parking.' : "Couldn't save. Try again."; $('#perr', w).classList.add('show'); $('#psave', w).disabled = false; return; }
    toast('Parking saved', 'ok'); close(); await refreshList(); if (TAB === 'cars') renderCars(true);
  };
}

/* ---- schedule & parking zones (admins edit, everyone sees) ---- */
function renderSchedule() {
  const tb = $('#tbody'); if (!EV) { tb.innerHTML = '<div class="empty">No events yet.</div>'; return; }
  const s = JSON.parse(JSON.stringify(SCHED[EV.id] || { event_id: String(EV.id), headline: 'Showcase Car Schedule', items: [], notes: [], zones: [{ name: 'Front VIP', color: '#ffb020' }, { name: 'Middle VIP', color: '#a78bfa' }, { name: 'Back VIP', color: '#3dd6ff' }, { name: 'General', color: '#9a9aa6' }] }));
  if (!ME.isAdmin) { tb.innerHTML = scheduleHTML(s, { event_name: EV.name, event_date: EV.event_date, event_location: EV.location }) || '<div class="empty">No schedule yet. An admin can add one here.</div>'; return; }
  const draw = () => {
    tb.innerHTML = `<div class="card sec"><h3>Schedule</h3><p class="muted small">Shows under every showcaser's pass for ${esc(EV.name)}.</p>
<label class="fld"><span>Title</span><input class="inp" data-k="headline" value="${esc(s.headline || '')}"></label>
${(s.items || []).map((it, i) => `<div class="ed-item"><input class="inp" data-i="${i}" data-f="time" value="${esc(it.time || '')}" placeholder="10:00 AM"><div style="display:grid;gap:6px"><input class="inp" data-i="${i}" data-f="title" value="${esc(it.title || '')}" placeholder="What happens"><input class="inp" data-i="${i}" data-f="detail" value="${esc(it.detail || '')}" placeholder="Details (optional)"></div>
<div class="ed-acts"><label class="check"><input type="checkbox" data-i="${i}" data-f="alert" ${it.alert ? 'checked' : ''}> Red</label><button type="button" class="icon-btn" data-up="${i}" aria-label="Move up">${I.up}</button><button type="button" class="icon-btn" data-del="${i}" aria-label="Remove">${I.trash}</button></div></div>`).join('')}
<button class="btn sm" id="additem" type="button">${I.plus} Add time</button>
<h3 style="margin-top:10px">Important notes</h3>${(s.notes || []).map((n, i) => `<div class="ed-note"><input class="inp" data-n="${i}" value="${esc(n)}"><button type="button" class="icon-btn" data-ndel="${i}" aria-label="Remove note">${I.trash}</button></div>`).join('')}
<button class="btn sm" id="addnote" type="button">${I.plus} Add note</button></div>
<div class="card sec"><h3>Parking zones</h3><p class="muted small">Pick one for each car under Cars → Parking. VIP spots show in color on the pass.</p>
${(s.zones || []).map((z, i) => `<div class="zone-ed"><input type="color" data-zc="${i}" value="${esc(z.color || '#ffb020')}" aria-label="Zone color"><input class="inp" data-zn="${i}" value="${esc(z.name)}" style="height:44px;font-size:14px"><button type="button" class="icon-btn" data-zdel="${i}" aria-label="Remove zone">${I.trash}</button></div>`).join('')}
<button class="btn sm" id="addzone" type="button">${I.plus} Add zone</button></div>
<div style="display:flex;justify-content:flex-end;gap:8px"><a class="btn ghost" href="${esc(CFG.publicUrl)}" target="_blank" rel="noopener">See pass page</a><button class="btn primary" id="ssave">Save schedule & zones</button></div>`;
  };
  draw();
  tb.oninput = e => { const t = e.target, d = t.dataset;
    if (d.k) s[d.k] = t.value;
    if (d.i !== undefined && d.f) s.items[+d.i][d.f] = t.type === 'checkbox' ? t.checked : t.value;
    if (d.n !== undefined) s.notes[+d.n] = t.value;
    if (d.zn !== undefined) s.zones[+d.zn].name = t.value;
    if (d.zc !== undefined) s.zones[+d.zc].color = t.value; };
  tb.onchange = tb.oninput;
  tb.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (b.id === 'additem') { s.items.push({ time: '', title: '', detail: '' }); draw(); }
    if (b.id === 'addnote') { s.notes.push(''); draw(); }
    if (b.id === 'addzone') { (s.zones ||= []).push({ name: 'New zone', color: '#ff5a36' }); draw(); }
    if (d.del) { s.items.splice(+d.del, 1); draw(); }
    if (d.up && +d.up > 0) { const k = +d.up; [s.items[k - 1], s.items[k]] = [s.items[k], s.items[k - 1]]; draw(); }
    if (d.ndel) { s.notes.splice(+d.ndel, 1); draw(); }
    if (d.zdel) { s.zones.splice(+d.zdel, 1); draw(); }
    if (b.id === 'ssave') {
      b.disabled = true;
      const row = { event_id: String(EV.id), headline: s.headline || 'Schedule', items: s.items.filter(i => i.time || i.title), notes: s.notes.filter(Boolean), zones: s.zones.filter(z => z.name.trim()), updated_at: new Date().toISOString() };
      const { error } = await sb.from('checkin_schedules').upsert(row);
      b.disabled = false;
      if (error) return toast(/row-level|permission/i.test(error.message) ? 'Only admins can change the schedule.' : "Couldn't save. Try again.", 'err');
      SCHED[EV.id] = row; toast('Schedule saved', 'ok');
    }
  };
}

route();
</script>
</body>
</html>
